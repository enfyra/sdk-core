<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enfyra SDK Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .loading { opacity: 0.5; pointer-events: none; }
      .success { border-color: #10b981; background-color: #d1fae5; }
      .error { border-color: #ef4444; background-color: #fee2e2; }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
      <!-- Header -->
      <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <h1 class="text-3xl font-bold text-blue-600 mb-2">🚀 Enfyra SDK Playground</h1>
        <p class="text-gray-600">Test all SDK features with the Nuxt server</p>
        <div class="mt-4 flex gap-4">
          <input 
            type="text" 
            id="baseUrl" 
            value="http://localhost:3000/api"
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Base URL"
          />
          <button 
            onclick="initClient()"
            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
          >
            Initialize Client
          </button>
        </div>
        <div id="clientStatus" class="mt-2 text-sm"></div>
      </div>

      <!-- Test Sections -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Authentication -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            🔐 Authentication
          </h2>
          
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
              <input 
                type="email" 
                id="loginEmail" 
                value="enfyra@admin.com"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
              <input 
                type="password" 
                id="loginPassword" 
                value="1234"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          
            <button 
              onclick="testAll()"
              class="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-semibold"
            >
              🚀 Test All (Run Complete Suite)
            </button>
            
            <div class="flex gap-2">
              <button 
                onclick="testLogin()"
                class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
              >
                Login
              </button>
              <button 
                onclick="testMe()"
                class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition"
              >
                Get /me
              </button>
            </div>
            
            <div class="flex gap-2">
              <button 
                onclick="testRefreshToken()"
                class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition"
              >
                Refresh Token
              </button>
              <button 
                onclick="checkAuthStatus()"
                class="flex-1 px-4 py-2 bg-pink-600 text-white rounded-lg hover:bg-pink-700 transition"
              >
                Check Status
              </button>
            </div>
            
            <div class="flex gap-2">
              <button 
                onclick="testLogout()"
                class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
              >
                Logout
              </button>
              <button 
                onclick="checkCookies()"
                class="flex-1 px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition"
              >
                Check Cookies
              </button>
            </div>
          </div>

          <div id="authResult" class="mt-4 p-3 bg-gray-50 rounded-lg text-sm font-mono overflow-auto max-h-64"></div>
        </div>

        <!-- CRUD Operations -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            📊 CRUD Operations
          </h2>
          
          <div class="space-y-3">
            <button 
              onclick="testRouteDefinition()"
              class="w-full px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition"
            >
              📍 List Route Definitions
            </button>
            
            <div class="flex gap-2">
              <button 
                onclick="testListUsers()"
                class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
              >
                List Users
              </button>
              <button 
                onclick="testCreateUser()"
                class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition"
              >
                Create User
              </button>
            </div>

            <div class="flex gap-2">
              <button 
                onclick="testUpdateUser()"
                class="flex-1 px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition"
              >
                Update User
              </button>
              <button 
                onclick="testDeleteUser()"
                class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
              >
                Delete User
              </button>
            </div>

            <div class="flex gap-2">
              <button 
                onclick="testFilterUsers()"
                class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition"
              >
                Filter Users
              </button>
              <button 
                onclick="testMetaQuery()"
                class="flex-1 px-4 py-2 bg-pink-600 text-white rounded-lg hover:bg-pink-700 transition"
              >
                With Meta
              </button>
            </div>
          </div>

          <div id="crudResult" class="mt-4 p-3 bg-gray-50 rounded-lg text-sm font-mono overflow-auto max-h-64"></div>
        </div>

        <!-- File Storage -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            📁 File Storage
          </h2>
          
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Select File</label>
              <input 
                type="file" 
                id="fileInput"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
              <input 
                type="text" 
                id="fileTitle" 
                value="Test File"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            
            <div class="flex gap-2">
              <button 
                onclick="testUploadFile()"
                class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
              >
                Upload File
              </button>
              <button 
                onclick="testListFiles()"
                class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition"
              >
                List Files
              </button>
            </div>

            <button 
              onclick="testFolderTree()"
              class="w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition"
            >
              Get Folder Tree
            </button>
          </div>

          <div id="storageResult" class="mt-4 p-3 bg-gray-50 rounded-lg text-sm font-mono overflow-auto max-h-64"></div>
        </div>

        <!-- Custom Routes -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            🔧 Custom Routes
          </h2>
          
          <div class="space-y-3">
            <div class="flex gap-2">
              <select id="customMethod" class="px-3 py-2 border border-gray-300 rounded-lg">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PATCH">PATCH</option>
                <option value="DELETE">DELETE</option>
              </select>
              <input 
                type="text" 
                id="customEndpoint" 
                value="/search"
                class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="/custom-endpoint"
              />
            </div>
            <textarea 
              id="customBody" 
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              rows="2"
              placeholder='{"key": "value"}'
            ></textarea>
            
            <button 
              onclick="testCustomRoute()"
              class="w-full px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 transition"
            >
              Send Request
            </button>
          </div>

          <div id="customResult" class="mt-4 p-3 bg-gray-50 rounded-lg text-sm font-mono overflow-auto max-h-64"></div>
        </div>

        <!-- WebSocket -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            🔌 WebSocket
          </h2>
          
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Gateway</label>
              <input 
                type="text" 
                id="wsGateway" 
                value="chat"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            
            <div class="flex gap-2">
              <button 
                onclick="testWebSocketConnect()"
                class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition"
              >
                Connect
              </button>
              <button 
                onclick="testWebSocketDisconnect()"
                class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
              >
                Disconnect
              </button>
            </div>

            <div class="flex gap-2">
              <input 
                type="text" 
                id="wsMessage" 
                value="Hello!"
                class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Message"
              />
              <button 
                onclick="testWebSocketSend()"
                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
              >
                Send
              </button>
            </div>
          </div>

          <div id="wsResult" class="mt-4 p-3 bg-gray-50 rounded-lg text-sm font-mono overflow-auto max-h-64"></div>
          <div id="wsStatus" class="mt-2 text-sm font-medium"></div>
        </div>

        <!-- Error Handling -->
        <div class="bg-white rounded-lg shadow-md p-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
            ⚠️ Error Handling
          </h2>
          
          <div class="space-y-3">
            <button 
              onclick="test404Error()"
              class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"
            >
              Test 404 Error
            </button>
            <button 
              onclick="testValidationError()"
              class="w-full px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition"
            >
              Test Validation Error
            </button>
            <button 
              onclick="testAuthError()"
              class="w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition"
            >
              Test 401 Error
            </button>
          </div>

          <div id="errorResult" class="mt-4 p-3 bg-gray-50 rounded-lg text-sm font-mono overflow-auto max-h-64"></div>
        </div>
      </div>

      <!-- Logs -->
      <div class="bg-white rounded-lg shadow-md p-6 mt-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
          📋 Logs
        </h2>
        <div class="flex gap-2 mb-4">
          <button 
            onclick="clearLogs()"
            class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition"
          >
            Clear Logs
          </button>
          <button 
            onclick="exportLogs()"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
          >
            Export Logs
          </button>
        </div>
        <div id="logs" class="p-4 bg-gray-900 text-green-400 rounded-lg font-mono text-sm overflow-auto max-h-96"></div>
      </div>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
